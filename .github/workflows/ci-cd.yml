name: FastAPI + React CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Compose services
        run: docker-compose build

      - name: Run backend container for tests
        run: |
          docker-compose up -d fastapi-backend postgres
          sleep 15
          # run backend tests
          docker exec -i $(docker ps -q -f name=fastapi-backend) pytest app/tests/
          docker-compose down