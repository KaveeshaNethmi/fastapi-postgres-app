name: FastAPI + React CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build all services
      - name: Build Docker Compose services
        run: docker compose build

      # Run backend + DB and test
      - name: Run backend container for tests
        run: |
          docker compose up -d postgres fastapi-backend
          echo "Waiting for services to start..."
          sleep 15

          # Get backend container ID
          CONTAINER_ID=$(docker ps -qf "name=fastapi-backend")

          # Run tests (if you have tests)
          docker exec -i $CONTAINER_ID pytest app/tests/ || echo "No tests found, skipping..."

          docker compose down